name: Build Exam Reminder Executables

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: exam-reminder-linux
            exe_name: exam_reminder
          - os: windows-latest
            artifact_name: exam-reminder-windows
            exe_name: exam_reminder.exe
          - os: macos-latest
            artifact_name: exam-reminder-macos
            exe_name: exam_reminder

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependency
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build executable
        run: pyinstaller --onefile --name exam_reminder exam_reminder.py

      - name: Package artifact (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p release
          cp dist/${{ matrix.exe_name }} release/
          cp README.md exam_reminder_project.md release/
          cd release
          tar -czf ${{ matrix.artifact_name }}.tar.gz ${{ matrix.exe_name }} README.md exam_reminder_project.md

      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist/${{ matrix.exe_name }} release/
          Copy-Item README.md release/
          Copy-Item exam_reminder_project.md release/
          Compress-Archive -Path release/* -DestinationPath release/${{ matrix.artifact_name }}.zip -Force

      - name: Upload artifact (Linux/macOS)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release/${{ matrix.artifact_name }}.tar.gz

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release/${{ matrix.artifact_name }}.zip
